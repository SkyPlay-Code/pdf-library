<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="online-library.png" type="image/png">
    <title>PDF Archive Hub v2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-graduation-cap"></i> Archive Hub
        </div>
        <div class="search-container">
            <i class="fa-solid fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search title, ID (e.g., '101'), or keyword...">
            <!-- Button to clear search/filters -->
            <button id="clearSearchBtn" class="clear-btn" style="display:none;">&times;</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-section">
                <div class="nav-label">MAIN</div>
                <!-- "All Materials" Button -->
                <button class="nav-item active" id="btnAllMaterials">
                    <i class="fa-solid fa-border-all"></i> Dashboard
                </button>
            </div>
            
            <div class="nav-section">
                <div class="nav-label">SUBJECTS</div>
                <nav id="subjectNav">
                    <!-- Javascript will load subjects here -->
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area" id="mainScroll">
            <div id="welcomeMessage" class="welcome-banner">
                <h2>Student Archive</h2>
                <p>Select a subject or use the search bar to find resources.</p>
            </div>

            <!-- This container will hold the structured Groups -->
            <div id="contentContainer"></div>
        </main>
    </div>

    <!-- Modal for Preview -->
    <div id="pdfModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Document Viewer</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <iframe id="pdfViewer" src="" frameborder="0"></iframe>
            </div>
            <div class="modal-footer">
                <a href="#" id="modalDownloadBtn" target="_blank" class="btn btn-primary">
                    <i class="fa-solid fa-external-link-alt"></i> Open in Drive
                </a>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
