<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="theme-color-meta" content="#03dac6">
    <title>My PDF Library</title>
    
    <link rel="icon" type="image/png" href="online-library.png">
    
    <!-- PERFORMANCE: Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- PERFORMANCE: Async CSS Loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    </noscript>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>PDF Library</h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for any chapter or book...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>

    <main>
        <div class="main-container">
            <div id="tab-container" class="tab-container"></div>
            <h2 id="current-category-title" class="category-title"></h2>
            
            <!-- NEW: Skeleton Loader for improved perceived performance -->
            <div id="grid-loader" class="grid-container">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <div id="pdf-grid" class="grid-container" style="display: none;"></div>
        </div>
    </main>

    <!-- The Modal -->
    <div id="pdf-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <!-- NEW: Direct download link inside the modal -->
                <a id="modal-download-link" href="#" download class="modal-download-btn">
                    <i class="fas fa-download"></i> Download
                </a>
                <span class="close-button">×</span>
            </div>
            <div class="loader-container" id="pdf-loader">
                <div class="loader"></div>
                <p>Loading Preview...</p>
            </div>
            <iframe id="pdf-frame" src="" frameborder="0"></iframe>
        </div>
    </div>

    <!-- ======================= FOOTER START ======================= -->
    <footer>
        <p>
            © 2025 <span class="footer-name">SkyPlay-Code</span> | 
            <a href="https://github.com/SkyPlay-Code/pdf-library" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i> View Source Code
            </a>
        </p>
    </footer>
    <!-- ======================= FOOTER END ========================= -->

    <script src="script.js" defer></script>
</body>
</html>
